<section class="py-4">
  <h1 class="h3 mb-4">Product Management</h1>
  <p *ngIf="products.length === 0" class="text-muted">No products left.</p>
  <div class="row g-4">
    <div class="col-12 col-sm-6 col-lg-3" *ngFor="let product of products">
      <div class="card h-100 shadow-sm">
        <div class="card-body d-flex flex-column">
          <app-product-details [product]="product"></app-product-details>
          <button type="button" class="btn btn-dark mt-auto"
                  (click)="deleteProduct(product.id)">Delete</button>
        </div>
      </div>
    </div>
  </div>
</section>
